<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サロン進捗管理</title>
  <meta name="theme-color" content="#121821">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #fff;
      --surface-2: #f8fafc;
      --text: #202532;
      --muted: #667085;
      --line: #dde3ed;
      --nav: #121821;
      --blue: #2f6fed;
      --green: #14946f;
      --amber: #c98211;
      --red: #c2413f;
      --shadow: 0 14px 36px rgba(16, 24, 40, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Yu Gothic UI", "Hiragino Sans", Meiryo, system-ui, sans-serif;
      background:
        linear-gradient(180deg, rgba(47,111,237,.09), rgba(47,111,237,0) 320px),
        var(--bg);
    }

    button, input, select { font: inherit; }

    button {
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 800;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 282px 1fr;
    }

    [hidden] { display: none !important; }

    .app.personal-mode {
      grid-template-columns: 1fr;
    }

    .app.personal-mode main {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
    }

    .app.personal-mode .workspace {
      grid-template-columns: 1fr;
    }

    .app.personal-mode .overview,
    .app.personal-mode .side-panel,
    .app.personal-mode #focusChapterForm,
    .app.personal-mode #completeAllButton,
    .app.personal-mode #clearAllButton,
    .app.personal-mode [data-fill-chapter],
    .app.personal-mode [data-clear-chapter],
    .app.personal-mode [data-delete-chapter],
    .app.personal-mode [data-delete-task],
    .app.personal-mode input[type="date"][data-due-task] {
      display: none !important;
    }

    .app.personal-mode .task {
      grid-template-columns: 28px 1fr;
    }

    .access-gate {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .access-card {
      width: min(520px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 22px;
      display: grid;
      gap: 14px;
    }

    .access-card h1 {
      font-size: 28px;
    }

    .access-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .access-error {
      color: var(--red);
      font-size: 13px;
      font-weight: 800;
      min-height: 18px;
    }

    .sidebar {
      background: var(--nav);
      color: #f8fafc;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 6px;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--blue), var(--green));
      font-size: 20px;
      font-weight: 900;
    }

    .brand strong { display: block; font-size: 18px; }
    .brand span { display: block; color: #a9b2c3; font-size: 12px; margin-top: 2px; }

    .search {
      width: 100%;
      border: 1px solid #303849;
      background: #222a37;
      color: white;
      border-radius: 7px;
      padding: 12px;
      outline: 0;
    }

    .search::placeholder { color: #9aa4b5; }

    .member-list {
      display: grid;
      gap: 8px;
      overflow: auto;
      padding-right: 2px;
    }

    .member {
      width: 100%;
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 10px;
      text-align: left;
      color: #dce3ef;
      background: transparent;
      padding: 10px 8px;
    }

    .member:hover,
    .member.active { background: #222a37; }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 900;
      background: var(--blue);
    }

    .avatar.large {
      width: 58px;
      height: 58px;
      font-size: 20px;
    }

    .member-name { font-weight: 800; }
    .member-note { color: #a9b2c3; font-size: 12px; margin-top: 2px; }
    .member-percent { color: white; font-size: 13px; font-weight: 900; }

    .side-actions {
      margin-top: auto;
      display: grid;
      gap: 8px;
    }

    .dark-button {
      background: #222a37;
      color: white;
      padding: 11px;
    }

    main {
      min-width: 0;
      padding: 26px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: 0;
    }

    .lead {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.7;
      max-width: 780px;
    }

    .primary {
      background: var(--blue);
      color: white;
      padding: 12px 15px;
      box-shadow: 0 12px 22px rgba(47,111,237,.18);
      white-space: nowrap;
    }

    .ghost {
      background: #eef2f8;
      color: #263043;
      padding: 10px 12px;
    }

    .danger {
      background: #fff0ef;
      color: var(--red);
      padding: 10px 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat, .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stat {
      padding: 16px;
      min-height: 100px;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    .stat strong {
      display: block;
      margin-top: 10px;
      font-size: 28px;
    }

    .overview {
      margin-bottom: 16px;
      overflow: hidden;
    }

    .overview-tabs {
      display: grid;
      gap: 8px;
      padding: 12px;
      max-height: 520px;
      overflow: auto;
    }

    .student-tab {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .student-tab-button {
      width: 100%;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 11px 12px;
      background: transparent;
      color: var(--text);
      text-align: left;
    }

    .student-tab-button:hover,
    .student-tab.open .student-tab-button {
      background: #eef2f8;
    }

    .student-tab-main {
      min-width: 0;
    }

    .student-tab-main strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .student-tab-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .student-tab-panel {
      display: none;
      padding: 0 12px 12px 60px;
    }

    .student-tab.open .student-tab-panel {
      display: grid;
      gap: 10px;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 8px;
    }

    .overview-metric {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      padding: 10px;
    }

    .overview-metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
      font-weight: 800;
    }

    .overview-metric strong {
      font-size: 16px;
    }

    .bar {
      width: 150px;
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      background: #e9eef6;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--blue), var(--green));
      border-radius: inherit;
    }

    .student-tab-panel .bar {
      width: 100%;
      max-width: 520px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      background: #eef2f8;
      color: #263043;
    }

    .status-pill.done { background: #e9f8f2; color: var(--green); }
    .status-pill.alert { background: #fff6e6; color: var(--amber); }
    .status-pill.late { background: #fff0ef; color: var(--red); }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }

    .panel { overflow: hidden; }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 18px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chapter { border-bottom: 1px solid var(--line); }
    .chapter:last-child { border-bottom: 0; }

    .chapter-summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 18px 16px;
    }

    .chapter-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
    }

    .chapter-title strong {
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .badge {
      min-width: 46px;
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e9f8f2;
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .progress-track {
      height: 10px;
      background: #ecf0f6;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green));
      transition: width .2s ease;
    }

    .chapter-meta,
    .due-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .chapter-description {
      margin: 10px 0 0;
      max-width: 760px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .due-note.late { color: var(--red); font-weight: 800; }
    .due-note.soon { color: var(--amber); font-weight: 800; }

    .tasks {
      display: grid;
      gap: 8px;
      padding: 0 16px 18px;
    }

    .task {
      display: grid;
      grid-template-columns: 28px 1fr 150px auto;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid #edf1f6;
      border-radius: 7px;
    }

    .task input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
    }

    .task input[type="date"] {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px;
      background: white;
      min-width: 0;
    }

    .task-title { overflow-wrap: anywhere; }
    .task.done .task-title { color: var(--muted); text-decoration: line-through; }

    .side-panel {
      display: grid;
      gap: 16px;
    }

    .profile {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .profile-main {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .profile h2 {
      margin: 0;
      font-size: 22px;
    }

    .profile p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .ring {
      --angle: 0deg;
      width: 150px;
      height: 150px;
      margin: 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--green) var(--angle), #edf1f6 0deg);
    }

    .ring-inner {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: white;
      border: 1px solid #edf1f6;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .ring-inner strong {
      display: block;
      font-size: 30px;
    }

    .ring-inner span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .form {
      display: grid;
      gap: 10px;
      padding: 16px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .field input,
    .field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      outline: 0;
      padding: 11px 12px;
    }

    .empty {
      padding: 26px 16px;
      color: var(--muted);
      text-align: center;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 5;
      padding: 12px 14px;
      border-radius: 7px;
      background: #111827;
      color: white;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1120px) {
      .app { grid-template-columns: 230px 1fr; }
      .workspace { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
    }

    @media (max-width: 760px) {
      .app { display: block; }
      .sidebar {
        min-height: 0;
        padding: 14px 12px;
        gap: 12px;
      }
      .brand strong { font-size: 16px; }
      .search { padding: 10px; }
      .member-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-height: 220px;
      }
      .member {
        grid-template-columns: 32px minmax(0, 1fr) auto;
        gap: 7px;
        padding: 8px 6px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
      .member-name {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      main { padding: 12px; }
      .topbar { display: grid; }
      h1 { font-size: 24px; }
      .lead { font-size: 13px; }
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .stat {
        min-height: 78px;
        padding: 12px;
      }
      .stat strong { font-size: 22px; }
      .panel-head {
        align-items: flex-start;
        padding: 12px;
      }
      .overview-tabs {
        padding: 8px;
        max-height: 420px;
      }
      .student-tab-button {
        grid-template-columns: 32px minmax(0, 1fr);
        padding: 10px;
      }
      .student-tab-summary {
        grid-column: 2;
        justify-content: space-between;
        width: 100%;
      }
      .student-tab-panel {
        padding: 0 10px 10px 52px;
      }
      .overview-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .overview-metric { padding: 8px; }
      .chapter-summary { grid-template-columns: 1fr; }
      .task { grid-template-columns: 28px 1fr; }
      .task input[type="date"],
      .task .danger { grid-column: 2; justify-self: start; }
    }
  </style>
</head>
<body>
  <section id="accessGate" class="access-gate">
    <form id="accessForm" class="access-card">
      <div class="brand" style="padding:0;color:var(--text)">
        <div class="mark">進</div>
        <div>
          <strong>サロン進捗管理</strong>
          <span>Personal Progress Page</span>
        </div>
      </div>
      <h1>自分の進捗ページを開く</h1>
      <p>登録されている表示名を入力すると、自分の章別タスクだけを確認できます。</p>
      <div class="field">
        <label for="accessName">登録名</label>
        <input id="accessName" autocomplete="name" placeholder="例: 上条裕一">
      </div>
      <button class="primary" type="submit">自分のページを開く</button>
      <div id="accessError" class="access-error"></div>
    </form>
  </section>

  <div id="personalApp" class="app personal-mode" hidden>
    <aside class="sidebar" hidden>
      <div class="brand">
        <div class="mark">進</div>
        <div>
          <strong>サロン進捗管理</strong>
          <span>Member Progress Board</span>
        </div>
      </div>

      <input id="memberSearch" class="search" type="search" placeholder="サロン生を検索">
      <div id="memberList" class="member-list"></div>

    </aside>

    <main>
      <div class="topbar">
        <div>
          <h1>あなたの進捗ページ</h1>
          <p class="lead">自分の章別タスクと完了率だけを確認できます。完了した項目にチェックを入れて進めてください。</p>
        </div>
        <button id="switchMemberButton" class="primary">別の名前で開く</button>
      </div>

      <section id="stats" class="stats"></section>

      <section class="panel overview" hidden>
        <div class="panel-head">
          <h2>全員の進捗一覧</h2>
          <div class="toolbar">
            <button id="sortByProgress" class="ghost">進捗順</button>
            <button id="sortByDue" class="ghost">期限順</button>
          </div>
        </div>
        <div id="overviewRows" class="overview-tabs"></div>
      </section>

      <div class="workspace">
        <section class="panel">
          <div class="panel-head">
            <h2>章別タスク</h2>
            <div class="toolbar">
              <button id="completeAllButton" class="ghost">全完了</button>
              <button id="clearAllButton" class="ghost">全解除</button>
            </div>
          </div>
          <div id="chapters"></div>
        </section>

        <aside class="side-panel">
          <section id="profile" class="panel profile"></section>

          <section class="panel">
            <div class="panel-head"><h3>タスクを追加</h3></div>
            <form id="taskForm" class="form">
              <div class="field">
                <label for="chapterSelect">追加先</label>
                <select id="chapterSelect" required></select>
              </div>
              <div class="field">
                <label for="taskName">タスク名</label>
                <input id="taskName" required placeholder="例: ワークシートを提出">
              </div>
              <div class="field">
                <label for="taskDue">期限</label>
                <input id="taskDue" type="date">
              </div>
              <button class="primary" type="submit">追加する</button>
            </form>
          </section>

          <section class="panel">
            <div class="panel-head"><h3>章を追加</h3></div>
            <form id="chapterForm" class="form">
              <div class="field">
                <label for="chapterName">章タイトル</label>
                <input id="chapterName" required placeholder="例: 第三章 実践課題">
              </div>
              <button class="primary" type="submit">章を作成</button>
            </form>
          </section>
        </aside>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function uid(prefix) {
      return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
    }

    function normalizeName(value) {
      return String(value || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "");
    }

    function openPersonalPage(memberId) {
      const member = state.members.find(item => item.id === memberId);
      if (!member) return false;
      state.activeMemberId = member.id;
      localStorage.setItem(PERSONAL_MEMBER_KEY, member.id);
      accessGate.hidden = true;
      personalApp.hidden = false;
      render();
      return true;
    }

    function findPersonalMember(input) {
      const query = normalizeName(input);
      if (!query) return { error: "登録名を入力してください。" };

      const exact = state.members.find(member => normalizeName(member.name) === query);
      if (exact) return { member: exact };

      const partial = state.members.filter(member => normalizeName(member.name).includes(query));
      if (partial.length === 1) return { member: partial[0] };
      if (partial.length > 1) return { error: "該当する名前が複数あります。登録名をもう少し正確に入力してください。" };
      return { error: "登録名が見つかりませんでした。表記を確認してください。" };
    }

    function makeMemberFromTemplate(name, index, template) {
      return {
        id: uid("m"),
        name,
        note: "緑のサロン生",
        color: colors[index % colors.length],
        chapters: template.chapters.map(chapter => ({
          id: uid("c"),
          title: chapter.title,
          description: chapter.description || "",
          tasks: chapter.tasks.map(task => ({
            id: uid("t"),
            title: task.title,
            done: false,
            due: task.due || ""
          }))
        }))
      };
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return normalize(clone(sampleData));
      try {
        const parsed = JSON.parse(saved);
        return parsed.members && parsed.members.length ? normalize(parsed) : normalize(clone(sampleData));
      } catch {
        return normalize(clone(sampleData));
      }
    }

    function syncDoneStates(templateChapter, existingChapters) {
      const existingTasks = existingChapters.flatMap(chapter => chapter.tasks || []);
      return {
        ...templateChapter,
        tasks: templateChapter.tasks.map(task => {
          const sameTask = existingTasks.find(existing => existing.title === task.title || existing.id === task.id);
          return {
            ...task,
            done: sameTask ? Boolean(sameTask.done) : false,
            due: sameTask?.due || task.due || ""
          };
        })
      };
    }

    function applyCourseChapters(member) {
      const existingChapters = member.chapters || [];
      member.chapters = makeCourseChapters().map(chapter => syncDoneStates(chapter, existingChapters));
    }

    function ensureAffiliateChapter(member) {
      const chapterIndex = member.chapters.findIndex(chapter => {
        return chapter.title === "第4章 アフィリエイト編" || chapter.title.includes("アフィリエイト") || chapter.id === "c4";
      });

      if (chapterIndex === -1) {
        member.chapters.push(makeAffiliateChapter());
        return;
      }

      if (member.chapters[chapterIndex].title !== "第4章 アフィリエイト編") {
        member.chapters[chapterIndex] = makeAffiliateChapter();
      }
    }

    function normalize(data) {
      const legacyNames = ["佐藤 美咲", "田中 悠真", "山本 梨花", "上条 裕一", "本間 和志", "峯村 彰一", "上条裕一", "本間和志", "峯村彰一"];
      const isLegacyOnly = data.members.length <= 3 && data.members.every(member => legacyNames.includes(member.name));

      if (isLegacyOnly) {
        data = { activeMemberId: "", members: [] };
      }

      const template = data.members[0] || sampleData.members[0];
      salonMemberNames.forEach((name, index) => {
        if (data.members.some(member => member.name === name)) return;
        data.members.push(makeMemberFromTemplate(name, data.members.length + index, template));
      });

      if (!data.activeMemberId && data.members[0]) data.activeMemberId = data.members[0].id;

      data.members.forEach(member => {
        applyCourseChapters(member);
        member.chapters.forEach(chapter => {
          if (!("description" in chapter)) chapter.description = "";
          chapter.tasks.forEach(task => {
            if (!("due" in task)) task.due = "";
          });
        });
      });
      return data;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function activeMember() {
      return state.members.find(member => member.id === state.activeMemberId) || state.members[0];
    }

    function allTasks(member) {
      return member.chapters.flatMap(chapter => chapter.tasks);
    }

    function completion(memberOrChapters) {
      const chapterList = Array.isArray(memberOrChapters) ? memberOrChapters : memberOrChapters.chapters;
      const taskList = chapterList.flatMap(chapter => chapter.tasks);
      const total = taskList.length;
      const done = taskList.filter(task => task.done).length;
      return { total, done, percent: total ? Math.round(done / total * 100) : 0 };
    }

    function chapterCompletion(chapter) {
      const total = chapter.tasks.length;
      const done = chapter.tasks.filter(task => task.done).length;
      return { total, done, percent: total ? Math.round(done / total * 100) : 0 };
    }

    function nextDue(member) {
      const pending = allTasks(member).filter(task => !task.done && task.due).sort((a, b) => a.due.localeCompare(b.due));
      return pending[0] || null;
    }

    function daysUntil(dateString) {
      if (!dateString) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(dateString + "T00:00:00");
      return Math.round((due - today) / 86400000);
    }

    function dueText(task) {
      if (!task || !task.due) return "未設定";
      const days = daysUntil(task.due);
      if (days < 0) return `${formatDate(task.due)} 期限超過`;
      if (days === 0) return `${formatDate(task.due)} 今日`;
      if (days <= 3) return `${formatDate(task.due)} あと${days}日`;
      return formatDate(task.due);
    }

    function dueClass(task) {
      if (!task || !task.due) return "";
      const days = daysUntil(task.due);
      if (days < 0) return "late";
      if (days <= 3) return "soon";
      return "";
    }

    function formatDate(value) {
      if (!value) return "未設定";
      const [year, month, day] = value.split("-");
      return `${Number(month)}/${Number(day)}`;
    }

    function memberStatus(member) {
      const progress = completion(member);
      const due = nextDue(member);
      const dueState = dueClass(due);
      if (progress.percent === 100) return { text: "完了", className: "done" };
      if (dueState === "late") return { text: "期限超過", className: "late" };
      if (dueState === "soon") return { text: "期限近い", className: "alert" };
      if (progress.percent >= 70) return { text: "順調", className: "done" };
      return { text: "進行中", className: "" };
    }

    function initials(name) {
      return name.split(/\s+/).map(part => part[0]).join("").slice(0, 2) || "人";
    }

    function avatar(member, large = false) {
      return `<div class="avatar ${large ? "large" : ""}" style="background:${member.color}">${initials(member.name)}</div>`;
    }

    function statusLabel(percent) {
      if (percent === 100) return "完了";
      if (percent >= 70) return "順調";
      if (percent >= 30) return "進行中";
      return "着手";
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function renderMembers() {
      const query = memberSearch.value.trim().toLowerCase();
      const filtered = state.members.filter(member => {
        return `${member.name} ${member.note}`.toLowerCase().includes(query);
      }).sort((a, b) => completion(b).percent - completion(a).percent);

      memberList.innerHTML = filtered.map(member => {
        const progress = completion(member);
        return `
          <button class="member ${member.id === state.activeMemberId ? "active" : ""}" data-member-id="${member.id}">
            ${avatar(member)}
            <span>
              <span class="member-name">${escapeHtml(member.name)}</span>
              <span class="member-note">${progress.done}/${progress.total} タスク</span>
            </span>
            <span class="member-percent">${progress.percent}%</span>
          </button>
        `;
      }).join("") || `<div class="empty">該当するサロン生がいません。</div>`;
    }

    function renderStats() {
      const member = activeMember();
      const progress = completion(member);
      const chapterCount = member.chapters.length;
      const doneChapters = member.chapters.filter(chapter => chapterCompletion(chapter).percent === 100).length;

      stats.innerHTML = `
        <div class="stat"><span>あなたの消化率</span><strong>${progress.percent}%</strong></div>
        <div class="stat"><span>完了タスク</span><strong>${progress.done}/${progress.total}</strong></div>
        <div class="stat"><span>完了した章</span><strong>${doneChapters}/${chapterCount}</strong></div>
      `;
    }

    function renderOverview() {
      const members = [...state.members].sort((a, b) => {
        if (overviewSort === "due") {
          const aDue = nextDue(a)?.due || "9999-12-31";
          const bDue = nextDue(b)?.due || "9999-12-31";
          return aDue.localeCompare(bDue);
        }
        return completion(b).percent - completion(a).percent;
      });

      overviewRows.innerHTML = members.map(member => {
        const progress = completion(member);
        const doneChapters = member.chapters.filter(chapter => chapterCompletion(chapter).percent === 100).length;
        const due = nextDue(member);
        const status = memberStatus(member);
        const isOpen = member.id === openOverviewMemberId;
        return `
          <article class="student-tab ${isOpen ? "open" : ""}" data-overview-member="${member.id}">
            <button class="student-tab-button" type="button" aria-expanded="${isOpen ? "true" : "false"}">
              ${avatar(member)}
              <span class="student-tab-main">
                <strong>${escapeHtml(member.name)}</strong>
                <span class="member-note">${escapeHtml(member.note)}</span>
              </span>
              <span class="student-tab-summary">
                <span class="status-pill ${status.className}">${status.text}</span>
                <strong>${progress.percent}%</strong>
              </span>
            </button>
            <div class="student-tab-panel">
              <div class="bar"><div class="bar-fill" style="width:${progress.percent}%"></div></div>
              <div class="overview-grid">
                <div class="overview-metric"><span>消化率</span><strong>${progress.percent}%</strong></div>
                <div class="overview-metric"><span>完了タスク</span><strong>${progress.done}/${progress.total}</strong></div>
                <div class="overview-metric"><span>完了章</span><strong>${doneChapters}/${member.chapters.length}</strong></div>
                <div class="overview-metric"><span>次の期限</span><strong class="${dueClass(due) ? "due-note " + dueClass(due) : ""}">${dueText(due)}</strong></div>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderProfile() {
      const member = activeMember();
      const progress = completion(member);
      const due = nextDue(member);

      profile.innerHTML = `
        <div class="profile-main">

    function renderChapters() {
      const member = activeMember();
      if (!member.chapters.length) {
        chapters.innerHTML = `<div class="empty">まだ章がありません。右側から追加できます。</div>`;
        return;
      }

      chapters.innerHTML = member.chapters.map(chapter => {
        const progress = chapterCompletion(chapter);
        const tasks = chapter.tasks.map(task => `
          <label class="task ${task.done ? "done" : ""}">
            <input type="checkbox" data-chapter-id="${chapter.id}" data-task-id="${task.id}" ${task.done ? "checked" : ""}>
            <span class="task-title">${escapeHtml(task.title)}<br><span class="due-note ${dueClass(task)}">期限: ${dueText(task)}</span></span>
            <input type="date" value="${task.due || ""}" data-due-task="${task.id}" data-chapter-id="${chapter.id}" aria-label="期限">
            <button type="button" class="danger" data-delete-task="${task.id}" data-chapter-id="${chapter.id}">削除</button>
          </label>
        `).join("");

        return `
          <article class="chapter">
            <div class="chapter-summary">
              <div>
                <div class="chapter-title">

      const member = activeMember();

      if (checkbox) {
        const chapter = member.chapters.find(item => item.id === checkbox.dataset.chapterId);
        const task = chapter && chapter.tasks.find(item => item.id === checkbox.dataset.taskId);
        if (!task) return;
        task.done = checkbox.checked;
        render();
      }

      if (dueInput) {
        const chapter = member.chapters.find(item => item.id === dueInput.dataset.chapterId);

      const clearChapter = event.target.closest("[data-clear-chapter]");
      const deleteChapter = event.target.closest("[data-delete-chapter]");

      if (deleteTask) {
        const chapter = member.chapters.find(item => item.id === deleteTask.dataset.chapterId);
        chapter.tasks = chapter.tasks.filter(task => task.id !== deleteTask.dataset.deleteTask);
        showToast("タスクを削除しました");
        render();
      }

      if (fillChapter) {
        const chapter = member.chapters.find(item => item.id === fillChapter.dataset.fillChapter);
        chapter.tasks.forEach(task => task.done = true);
        showToast("章を完了にしました");
        render();
      }

      if (clearChapter) {
        const chapter = member.chapters.find(item => item.id === clearChapter.dataset.clearChapter);
        chapter.tasks.forEach(task => task.done = false);
        showToast("章を未完了にしました");
        render();
      }

      if (deleteChapter) {
        const chapter = member.chapters.find(item => item.id === deleteChapter.dataset.deleteChapter);
        if (!confirm(`${chapter.title} を削除しますか？`)) return;
        member.chapters = member.chapters.filter(item => item.id !== chapter.id);
        showToast("章を削除しました");
        render();
      }
    });

    $("#taskForm").addEventListener("submit", event => {
      event.preventDefault();
      const member = activeMember();
      const chapter = member.chapters.find(item => item.id === chapterSelect.value);
      const taskInput = $("#taskName");
      const dueInput = $("#taskDue");
      const title = taskInput.value.trim();
      if (!chapter || !title) return;
      chapter.tasks.push({ id: uid("t"), title, done: false, due: dueInput.value });
      taskInput.value = "";
      dueInput.value = "";
      taskInput.focus();
      showToast("タスクを追加しました");
      render();
    });

    $("#chapterForm").addEventListener("submit", event => {
      event.preventDefault();
      const input = $("#chapterName");
      const title = input.value.trim();
      if (!title) return;
      activeMember().chapters.push({ id: uid("c"), title, tasks: [] });
      input.value = "";
      showToast("章を追加しました");
      render();
    });

    const savedPersonalMemberId = localStorage.getItem(PERSONAL_MEMBER_KEY);
    if (savedPersonalMemberId && openPersonalPage(savedPersonalMemberId)) {
      accessGate.hidden = true;
    } else {
      personalApp.hidden = true;
      accessGate.hidden = false;
    }
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
